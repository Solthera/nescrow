[package]
name = "nescrow"
version = "0.1.0"
edition = "2021"
description = "Escrow for freelancers on NEAR: funds locked in a contract, disputes decided by a human arbiter"
repository = "https://github.com/Solthera/nescrow"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
strip = true
